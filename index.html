<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https://i.ibb.co;">
    <title>CPPS Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #22a4f3;
            font-family: 'proxima_nova_regular', Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }
        #gary {
            color: white;
            padding: 0;
            border: 0;
            outline: 0;
            vertical-align: baseline;
            font: inherit;
            position: relative;
            left: 50%;
            margin: 0px 0 0 -378px;
            width: 760px;
            height: 480px;
            background-image: url('https://i.ibb.co/twXxQ3J0/gary.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        #launcher-home-page {
            color: white;
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            vertical-align: baseline;
            font: inherit;
            position: relative;
            top: 100px;
            left: 320px;
            width: 330px;
        }
        #launcher-home-page h1 {
            padding: 0;
            border: 0;
            outline: 0;
            vertical-align: baseline;
            font: inherit;
            font-family: 'proxima_nova_bold', Helvetica, Arial, sans-serif;
            margin: 0;
            letter-spacing: -0.05em;
            text-rendering: optimizelegibility;
            padding-bottom: 18px;
            color: #222;
            font-weight: 600;
            line-height: 1.3em;
            margin-bottom: 20px;
            font-size: 18px;
        }
        #launcher-home-page span {
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            vertical-align: baseline;
            font: inherit;
            margin-bottom: 10px;
            color: #222;
            font-size: 14px;
            line-height: 1.3;
            display: block;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="gary">
            <div id="launcher-home-page" class="title">
                <h1>Welcome to CPPS Launcher!</h1>
                <div>
                    <span>Please select a server from the menu above to start playing.</span>
                </div>
            </div>
        </div>
    </div>
    <script>
        window.addEventListener('unload', () => {
            if (window.electronAPI && typeof window.electronAPI.cleanup === 'function') {
                window.electronAPI.cleanup();
            }
        });
    </script>
</body>
</html>
